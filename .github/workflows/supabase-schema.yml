# Applies supabase/schema.sql to the Supabase database every time it changes on main, so new
# features never need a manual trip to the SQL Editor. The file is idempotent (safe to re-run).
#
# One-time setup: GitHub repo → Settings → Secrets and variables → Actions → New repository
# secret, named SUPABASE_DB_URL, with the connection string from Supabase → Connect →
# "Session pooler" (the URI, with the database password filled in). Until that secret exists,
# this workflow just skips.
name: Update Supabase database

on:
  push:
    branches: [main]
    paths: [supabase/schema.sql]
  workflow_dispatch:

jobs:
  apply-schema:
    runs-on: ubuntu-latest
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - name: Skip if the database secret is not set yet
        if: env.SUPABASE_DB_URL == ''
        run: echo "::notice::SUPABASE_DB_URL is not set; skipping. See the comment at the top of this workflow."
      - uses: actions/checkout@v4
        if: env.SUPABASE_DB_URL != ''
      - name: Install psql
        if: env.SUPABASE_DB_URL != ''
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - name: Apply schema.sql
        if: env.SUPABASE_DB_URL != ''
        run: psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -q -f supabase/schema.sql
